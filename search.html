<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spotify</title>
  <link rel="stylesheet" href="/static/app.css">
</head>

<body class="page-search">

  <button id="settingsBtn" class="fab" title="Settings" aria-label="Settings">
    <i data-lucide="settings"></i>
  </button>

  <button id="queueBtn" class="queue-fab" title="Antrean" aria-label="Antrean">
    <i data-lucide="list-music"></i>
    <span id="queueCount" hidden>0</span>
  </button>

  <div class="queue-panel" id="queuePanel" hidden>
    <div class="queue-panel-head">
      <h3>Antrean berikutnya</h3>
      <button id="queueClear" title="Kosongkan antrean" aria-label="Kosongkan antrean">
        <i data-lucide="trash-2"></i>
      </button>
    </div>
    <div class="queue-list" id="queueList"></div>
    <p class="queue-empty" id="queueEmpty">Belum ada lagu di antrean.</p>
  </div>

  <div class="popover" id="settingsPop">
    <h3>Settings</h3>
    <label for="spdcInput">sp_dc</label>
    <input id="spdcInput" type="text" autocomplete="off" spellcheck="false"
      placeholder="Tempel sp_dc cookie di sini">
    <button class="save" id="btnSaveSpdc">Simpan</button>
    <div class="pmsg" id="settingsMsg"></div>
  </div>

  <main id="home">
    <div class="home-wrap">
      <div class="searchbar">
        <i data-lucide="search"></i>
        <input id="searchInput" type="text" placeholder="Cari lagu, artis, album..." autocomplete="off">
        <button id="btnSearch" title="Cari" aria-label="Cari">
          <i data-lucide="arrow-right"></i>
        </button>
        <div class="suggestions" id="suggestions" hidden></div>
      </div>

      <div class="spdc-banner" id="spdcBanner">
        <span>sp_dc belum diatur - lagu tidak bisa diputar.</span>
        <button class="banner-btn" id="bannerOpenSettings">Atur Sekarang</button>
      </div>

      <div class="hint" id="hint" hidden></div>

      <div class="results" id="results">
        <section class="top-results" id="topResults" hidden>
          <h2>Hasil teratas</h2>
          <div id="topResult"></div>
        </section>
        <section class="song-results" id="songResults" hidden>
          <h2>Lagu</h2>
          <div class="song-scroll-area" id="songScrollArea">
            <div id="songList"></div>
            <div class="scroll-skeleton" id="scrollSkeleton" hidden aria-hidden="true">
              <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
              <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
              <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
            </div>
            <div class="scroll-status" id="scrollStatus" aria-live="polite" hidden>
              <i data-lucide="loader-circle" class="spin-icon"></i>
              <span>Memuat hasil...</span>
            </div>
            <div class="scroll-sentinel" id="scrollSentinel" aria-hidden="true"></div>
          </div>
        </section>
      </div>

      <div class="results-skeleton" id="resultsSkeleton" hidden aria-hidden="true">
        <section>
          <div class="skeleton-heading"></div>
          <div class="skeleton-featured">
            <div class="skeleton-block skeleton-featured-cover"></div>
            <div class="skeleton-lines">
              <div class="skeleton-block skeleton-title"></div>
              <div class="skeleton-block skeleton-artist"></div>
              <div class="skeleton-block skeleton-meta"></div>
            </div>
          </div>
        </section>
        <section>
          <div class="skeleton-heading"></div>
          <div class="skeleton-song-list">
            <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
            <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
            <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
            <div class="skeleton-song"><div class="skeleton-block skeleton-thumb"></div><div class="skeleton-lines"><div class="skeleton-block skeleton-title"></div><div class="skeleton-block skeleton-artist"></div></div></div>
          </div>
        </section>
      </div>

    </div>
  </main>

  <div id="toast"></div>

  <iframe id="playerFrame" class="player-shell" title="Spotify Player"
    allow="autoplay *; encrypted-media; fullscreen; picture-in-picture; web-share"
    allowfullscreen frameborder="0" hidden></iframe>

  <div class="mini-player" id="miniPlayer" hidden>
    <div class="mini-copy">
      <strong id="miniTitle">Sedang diputar</strong>
      <span id="miniArtist"></span>
    </div>
    <button id="miniLyrics" title="Buka lirik" aria-label="Buka lirik">
      <i data-lucide="file-music"></i>
    </button>
    <button id="miniClose" title="Tutup mini player" aria-label="Tutup mini player">
      <i data-lucide="x"></i>
    </button>
    <iframe id="miniFrame" allow="autoplay *; encrypted-media; fullscreen; picture-in-picture; web-share"
      allowfullscreen frameborder="0" loading="eager"></iframe>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/static/search.js"></script>
</body>

</html>
